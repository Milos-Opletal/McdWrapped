<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McdWrapped 🍟</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
    
    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <h1 class="gradient-text">McdWrapped</h1>
            <p class="subtitle" id="t-subtitle">Discover the stats behind your career.</p>
            
            <div class="input-group" style="margin-bottom: 20px;">
                <select id="lang-select" style="width: 100%; padding: 12px; background: rgba(255,255,255,0.8); border: 2px solid var(--secondary); border-radius: 12px; font-family: 'Outfit'; font-size: 1rem; color: var(--text-dark);">
                    <option value="cs" selected>Čeština (Czech)</option>
                    <option value="en">English</option>
                    <option value="uk">Українська (Ukrainian)</option>
                    <option value="ru">Русский (Russian)</option>
                </select>
            </div>
            
            <form id="login-form">
                <div class="input-group">
                    <input type="email" id="email" name="email" placeholder="MyMcd Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" id="submit-btn">Unwrap</button>
            </form>
            <div id="loading" class="loader hidden">
                <div class="spinner"></div>
                <p id="t-loading">Crunching your shifts... this may take up to 30 seconds!</p>
            </div>
            <div id="error-msg" class="error hidden"></div>
        </div>
    </div>

    <!-- WRAPPED SCREEN (Slide Carousel) -->
    <div id="wrapped-screen" class="screen hidden">
        <div class="progress-container" id="progress-container">
            <!-- Progress bars filled by JS -->
        </div>

        <div class="slide-navigation left" id="nav-left"></div>
        <div class="slide-navigation right" id="nav-right"></div>

        <div class="slide-container" id="slide-container">
            <!-- Slided content injected by JS -->
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
