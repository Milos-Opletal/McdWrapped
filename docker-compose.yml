services:
  # Service 1: The Website
  web:
    image: mcd-wrapped:latest
    container_name: mcd-wrapped-web
    restart: unless-stopped
    command: uvicorn app:app --host 0.0.0.0 --port 4334
    ports:
      - "4334:4334"
    networks:
      - nginx_default
    environment:
      - PYTHONUNBUFFERED=1

networks:
  nginx_default:
    external: true
